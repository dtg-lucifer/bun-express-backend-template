openapi: 3.0.0
info:
  version: 1.0.0
  title: Backend Template API
  description: Express + TypeScript backend API documentation
servers:
  - url: /api/v1
    description: API server
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
  parameters: {}
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                      tokens:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                        required:
                          - accessToken
                          - refreshToken
                    required:
                      - user
                      - tokens
                required:
                  - success
                  - message
                  - data
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /health:
    get:
      tags:
        - Health
      summary: Health check — returns server status and metrics
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Server is up and running!!
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      timestamp:
                        type: string
                        example: 2026-05-18T10:00:00.000Z
                      environment:
                        type: string
                        example: development
                      uptime:
                        type: object
                        properties:
                          milliseconds:
                            type: number
                            example: 123456
                          formatted:
                            type: string
                            example: 2m 3s
                          startedAt:
                            type: string
                            example: 2026-05-18T09:57:57.000Z
                        required:
                          - milliseconds
                          - formatted
                          - startedAt
                      memory:
                        type: object
                        properties:
                          used:
                            type: number
                            example: 42
                          total:
                            type: number
                            example: 128
                          unit:
                            type: string
                            enum:
                              - MB
                        required:
                          - used
                          - total
                          - unit
                      services:
                        type: object
                        properties:
                          database:
                            type: string
                            enum:
                              - connected
                              - error
                            example: connected
                        required:
                          - database
                      ping:
                        type: object
                        properties:
                          database:
                            anyOf:
                              - type: number
                              - type: string
                                enum:
                                  - error
                            example: 3
                          server:
                            type: number
                            example: 1
                          unit:
                            type: string
                            enum:
                              - ms
                        required:
                          - database
                          - server
                          - unit
                    required:
                      - status
                      - timestamp
                      - environment
                      - uptime
                      - memory
                      - services
                      - ping
                  statusCode:
                    type: number
                    example: 200
                required:
                  - success
                  - message
                  - data
                  - statusCode
        "500":
          description: Health check failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Health check failed
                  statusCode:
                    type: number
                    example: 500
                required:
                  - success
                  - message
                  - statusCode
  /users:
    get:
      tags:
        - Users
      summary: Get user by email
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: email
          required: true
          name: email
          in: query
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
  /users/me:
    get:
      tags:
        - Users
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
