openapi: 3.1.0
info:
  title: Backend Template API
  version: 0.0.0
tags:
  - name: Health
  - name: Authentication
paths:
  /auth/login:
    post:
      operationId: Auth_login
      summary: Login user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - success
                      - message
                      - statusCode
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/Models.User'
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                        required:
                          - user
                          - accessToken
                          - refreshToken
                      statusCode:
                        type: integer
                        format: int32
                      requestId:
                        type: string
                  - $ref: '#/components/schemas/Models.ApiErrorResponse'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.LoginRequest'
  /auth/me:
    get:
      operationId: Auth_me
      summary: Get current user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - success
                      - message
                      - statusCode
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/Models.User'
                        required:
                          - user
                      statusCode:
                        type: integer
                        format: int32
                      requestId:
                        type: string
                  - $ref: '#/components/schemas/Models.ApiErrorResponse'
      tags:
        - Authentication
  /auth/register:
    post:
      operationId: Auth_register
      summary: Register user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - success
                      - message
                      - statusCode
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/Models.User'
                        required:
                          - user
                      statusCode:
                        type: integer
                        format: int32
                      requestId:
                        type: string
                  - $ref: '#/components/schemas/Models.ApiErrorResponse'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.RegisterRequest'
  /healthcheck:
    get:
      operationId: Health_healthcheck
      summary: Health check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - success
                      - message
                      - statusCode
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      data:
                        $ref: '#/components/schemas/Models.HealthMetrics'
                      statusCode:
                        type: integer
                        format: int32
                      requestId:
                        type: string
                  - $ref: '#/components/schemas/Models.ApiErrorResponse'
      tags:
        - Health
components:
  schemas:
    Models.ApiErrorResponse:
      type: object
      required:
        - success
        - message
        - statusCode
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors: {}
        statusCode:
          type: integer
          format: int32
        requestId:
          type: string
    Models.AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    Models.HealthMetrics:
      type: object
      required:
        - status
        - timestamp
        - environment
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
        timestamp:
          type: string
        environment:
          type: string
        uptime:
          type: object
          properties:
            milliseconds:
              type: integer
              format: int64
            formatted:
              type: string
            startedAt:
              type: string
          required:
            - milliseconds
            - formatted
            - startedAt
        memory:
          type: object
          properties:
            used:
              type: integer
              format: int32
            total:
              type: integer
              format: int32
            unit:
              type: string
              enum:
                - MB
          required:
            - used
            - total
            - unit
        services:
          type: object
          properties:
            database:
              type: string
              enum:
                - connected
                - error
                - unknown
          required:
            - database
        ping:
          type: object
          properties:
            database:
              anyOf:
                - type: integer
                  format: int32
                - type: string
                  enum:
                    - error
                    - unknown
            server:
              type: integer
              format: int32
            unit:
              type: string
              enum:
                - ms
          required:
            - database
            - server
            - unit
    Models.LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    Models.RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    Models.User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
        email:
          type: string
servers:
  - url: http://localhost:8989/api/v1
    description: Development server
    variables: {}
