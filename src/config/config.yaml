# Backend Template Configuration
# @maintainer dtg-lucifer <dev.bosepiush@gmail.com>

# Server Configuration
server:
    host: localhost
    port: 8989
    api_prefix: /api/v1
    environment: development # development, production, staging

# Security Configuration
security:
    helmet:
        enabled: true
        content_security_policy: true
    cors:
        enabled: true
        # Allowed origins (comma-separated in ENV, array here)
        origins:
            - http://localhost:3000
            - http://localhost:5173
    rate_limit:
        enabled: true
        window_ms: 900000 # 15 minutes
        max_requests: 100
        skip_localhost: true # Skip rate limiting for localhost in development

# Database Configuration
database:
    # Connection string should be in environment variable: DATABASE_URL
    pool_size: 10
    connection_timeout: 10000 # milliseconds

# Redis Configuration
redis:
    # Connection URL should be in environment variable: REDIS_URL
    default_ttl: 3600 # 1 hour in seconds
    participant_cache_ttl: 300 # 5 minutes for participant cache

# Logging Configuration
logging:
    level: info # error, warn, info, debug
    format: simple # json, simple
    enable_colors: true
    log_requests: true
    log_errors: true

# Middleware Configuration
middlewares:
    request_id:
        enabled: true
        header_name: X-Request-ID
    body_parser:
        enabled: true
        json_limit: 10mb
        urlencoded_limit: 10mb
    dependency_injection:
        enabled: true
    logger:
        enabled: true

# Routes Configuration
routes:
    health:
        enabled: true
        path: /
    auth:
        enabled: true
        path: /auth
    events:
        enabled: true
        path: /events
    admin:
        enabled: true
        path: /admin
    participants:
        enabled: true
        path: /participants
    domain_leads:
        enabled: true
        path: /domain-leads
    checkin_crew:
        enabled: true
        path: /checkin-crew
    campuses:
        enabled: true
        path: /campuses
    registrations:
        enabled: true
        path: /registrations

# Documentation Configuration
documentation:
    swagger:
        enabled: true
        path: /docs
        openapi_file: typespec/tsp-output/schema/openapi.yaml

rbac:
    enabled: true
    roles:
        - super_admin
        - domain_lead
        - campus_ambassador
        - checkin_crew
        - participants
    permissions:
        super_admin:
            - MANAGE_ALL
        domain_lead:
            - MANAGE_EVENTS
            - MANAGE_REGISTRATIONS
            - MANAGE_PARTICIPANTS
            - MANAGE_TICKETS
            - VIEW_REPORTS
        checkin_crew:
            - MANAGE_TICKETS
            - VIEW_REPORTS
            - MANAGE_PARTICIPANTS
        campus_ambassador:
            - MANAGE_PARTICIPANTS
        participants:
            - VIEW_TICKETS
